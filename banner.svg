<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Furkan Kerem Selimoğlu">
  <!-- To change the rotating lines, edit the <text class="line"> elements below (keep the order). -->
  <style>
    .name { font: 700 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
    .sub  { font: 500 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; opacity: .85; }
    .line { font: 600 24px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #fee2e2; }
    text { text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#450a0a"/><stop offset=".5" stop-color="#991b1b"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0H1000V250C820 300 680 220 500 250S180 300 0 255Z"/>
  <text x="500" y="105" class="name">Furkan Kerem Selimoğlu</text>
  <text x="500" y="145" class="sub">Passionate Software Engineer</text>
  <clipPath id="c0"><rect x="0" y="180" height="50" width="0">
    <animate attributeName="width" dur="12.8s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0.0000;0.0781;0.2227;0.2500;1.0000" values="0;1000;1000;0;0"/></rect></clipPath>
  <text clip-path="url(#c0)" x="500" y="214" class="line">Hi 👋, I'm Kerem</text>
  <clipPath id="c1"><rect x="0" y="180" height="50" width="0">
    <animate attributeName="width" dur="12.8s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0.0000;0.2500;0.3281;0.4727;0.5000;1.0000" values="0;0;1000;1000;0;0"/></rect></clipPath>
  <text clip-path="url(#c1)" x="500" y="214" class="line">Working on Backend Development</text>
  <clipPath id="c2"><rect x="0" y="180" height="50" width="0">
    <animate attributeName="width" dur="12.8s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0.0000;0.5000;0.5781;0.7227;0.7500;1.0000" values="0;0;1000;1000;0;0"/></rect></clipPath>
  <text clip-path="url(#c2)" x="500" y="214" class="line">Learning Web and Mobile App&amp; Development</text>
  <clipPath id="c3"><rect x="0" y="180" height="50" width="0">
    <animate attributeName="width" dur="12.8s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0.0000;0.7500;0.8281;0.9727;1.0000" values="0;0;1000;1000;0"/></rect></clipPath>
  <text clip-path="url(#c3)" x="500" y="214" class="line">Fun fact: racket sports, movies &amp; TV series</text>
</svg>
