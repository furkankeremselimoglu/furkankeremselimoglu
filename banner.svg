<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Furkan Kerem Selimoğlu">
  <!-- To change the rotating lines, edit the text inside each <text class="line"> below (keep the order). -->
  <style>
    .name { font: 700 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
    .sub  { font: 500 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; opacity: .85; }
    .line { font: 600 24px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #fee2e2; }
    text { text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#450a0a"/><stop offset=".5" stop-color="#991b1b"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0H1000V205C820 250 680 175 500 205S180 250 0 210Z"/>
  <text x="500" y="88" class="name">Furkan Kerem Selimoğlu</text>
  <text x="500" y="124" class="sub">Passionate Software Engineer</text>
  <text x="500" y="178" class="line" opacity="0">Hi 👋, I'm Kerem
    <animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.0469;0.2969;0.3333;1.0000" values="0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.0469;0.2969;0.3333;1.0000" values="0 8;0 0;0 0;0 -8;0 -8"/>
  </text>
  <text x="500" y="178" class="line" opacity="0">Working on Backend Development
    <animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.3802;0.6302;0.6667;1.0000" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.3802;0.6302;0.6667;1.0000" values="0 8;0 8;0 0;0 0;0 -8;0 -8"/>
  </text>
  <text x="500" y="178" class="line" opacity="0">Learning Web&amp;Mobile App Development
    <animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.7135;0.9635;1.0000" values="0;0;1;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="9.6s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.7135;0.9635;1.0000" values="0 8;0 8;0 0;0 0;0 -8"/>
  </text>
</svg>
